name: discord-bug-bridge

# 디스코드 버그 리포트 채널의 새 글을 깃허브 이슈로 옮긴다 (1시간마다).
# 봇 토큰은 저장소 비밀값 DISCORD_BOT_TOKEN 에만 있고, 이 파일과 기록에는 남지 않는다.
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: discord-bug-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    env:
      CHANNEL_ID: "1571006229008875540"
    steps:
      - name: 옮기기
        uses: actions/github-script@v7
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        with:
          script: |
            const token = process.env.DISCORD_BOT_TOKEN;
            const channel = process.env.CHANNEL_ID;
            if (!token) { core.setFailed('DISCORD_BOT_TOKEN 비밀값이 없습니다'); return; }
            const api = async (path) => {
              const r = await fetch(`https://discord.com/api/v10${path}`, { headers: { Authorization: `Bot ${token}` } });
              if (!r.ok) throw new Error(`디스코드 ${r.status} ${path}`);
              return r.json();
            };
            // 이미 옮긴 글: 이슈 본문의 「discord-message:번호」 표시로 찾는다
            const done = new Set();
            for await (const page of github.paginate.iterator(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'all', labels: 'discord', per_page: 100 })) {
              for (const i of page.data) {
                const m = (i.body || '').match(/discord-message:(\d+)/);
                if (m) done.add(m[1]);
              }
            }
            const ch = await api(`/channels/${channel}`);
            const guild = ch.guild_id;
            const posts = [];
            if (ch.type === 15) {
              // 포럼 채널: 글(스레드)마다 첫 메시지
              const active = await api(`/guilds/${guild}/threads/active`);
              const archived = await api(`/channels/${channel}/threads/archived/public?limit=50`);
              const threads = [...active.threads.filter(t => t.parent_id === channel), ...archived.threads];
              for (const t of threads) {
                const first = await api(`/channels/${t.id}/messages/${t.id}`).catch(() => null);
                if (first) posts.push({ id: first.id, title: t.name, msg: first, link: `https://discord.com/channels/${guild}/${t.id}` });
              }
            } else {
              // 일반 채널: 최근 메시지 (스레드 답글·봇 글 제외)
              const msgs = await api(`/channels/${channel}/messages?limit=50`);
              for (const m of msgs) {
                // 봇 글·고정된 안내 글(「How to report a bug」 등)은 옮기지 않는다
                if (m.author?.bot || m.type !== 0 || m.pinned) continue;
                // 제목: 디스코드 꾸밈 글자를 뺀 첫 줄
                const line = (m.content || '').split('
').map(s => s.replace(/[*_`#>]/g, '').trim()).find(s => s) || '(내용 없음)';
                posts.push({ id: m.id, title: line.slice(0, 80), msg: m, link: `https://discord.com/channels/${guild}/${channel}/${m.id}` });
              }
            }
            // 오래된 것부터, 최근 3일 안 글만
            const since = Date.now() - 3 * 86400000;
            posts.sort((a, b) => (BigInt(a.id) < BigInt(b.id) ? -1 : 1));
            let made = 0;
            for (const p of posts) {
              if (done.has(p.id)) continue;
              if (new Date(p.msg.timestamp).getTime() < since) continue;
              const files = (p.msg.attachments || []).map(a => `- [${a.filename}](${a.url})`).join('\n');
              const body = [
                `> 디스코드 버그 리포트 채널에서 옮긴 글입니다. 원래 글: ${p.link}`,
                `> 작성: ${p.msg.author?.username || '알 수 없음'} · ${p.msg.timestamp}`,
                '',
                (p.msg.content || '(내용 없음)').slice(0, 6000),
                files ? `\n**첨부**\n${files}` : '',
                '',
                `<!-- discord-message:${p.id} -->`,
              ].join('\n');
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: `[디스코드] ${p.title}`, body, labels: ['discord'] });
              made++;
            }
            core.info(`옮긴 글 ${made}개`);
