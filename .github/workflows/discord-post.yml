# 디스코드 채널에 노리 봇으로 글 하나 올리기 (손으로 실행). 봇 토큰은 저장소 비밀값에만 있다.
name: discord-post
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "채널 이름에 들어간 글자 (예: general)"
        required: true
      reply_to:
        description: "답장할 사람 이름 (최근 글 50개에서 찾음, 비우면 그냥 올림)"
        required: false
      content:
        description: "올릴 글"
        required: true
permissions: {}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_FROM: "1571006229008875540"
          IN_CHANNEL: ${{ inputs.channel }}
          IN_REPLY: ${{ inputs.reply_to }}
          IN_CONTENT: ${{ inputs.content }}
        with:
          script: |
            const token = process.env.DISCORD_BOT_TOKEN;
            const api = async (p, opt = {}) => {
              const r = await fetch('https://discord.com/api/v10' + p, { ...opt, headers: { Authorization: `Bot ${token}`, 'Content-Type': 'application/json' } });
              if (!r.ok) throw new Error(`${p} ${r.status} ${await r.text()}`);
              return r.json();
            };
            const guild = (await api(`/channels/${process.env.GUILD_FROM}`)).guild_id;
            const chans = await api(`/guilds/${guild}/channels`);
            const want = process.env.IN_CHANNEL.toLowerCase();
            const ch = chans.find(c => c.type === 0 && c.name.toLowerCase().includes(want));
            if (!ch) { core.setFailed('채널 없음'); return; }
            const body = { content: process.env.IN_CONTENT.replace(/\n/g, '\n'), allowed_mentions: { parse: [], replied_user: true } };
            const who = (process.env.IN_REPLY || '').toLowerCase();
            if (who) {
              const msgs = await api(`/channels/${ch.id}/messages?limit=50`);
              const m = msgs.find(x => [x.author.username, x.author.global_name].filter(Boolean).some(n => n.toLowerCase() === who));
              if (!m) { core.setFailed('답장할 글 없음'); return; }
              body.message_reference = { message_id: m.id };
            }
            const sent = await api(`/channels/${ch.id}/messages`, { method: 'POST', body: JSON.stringify(body) });
            core.info(`올림: https://discord.com/channels/${guild}/${ch.id}/${sent.id}`);
