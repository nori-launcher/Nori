# 봇이 올린 디스코드 글 하나 지우기 (손으로 실행, 한 번 쓰고 지움)
name: discord-delete
on:
  workflow_dispatch:
    inputs:
      channel_id: { required: true }
      message_id: { required: true }
permissions: {}
jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CH: ${{ inputs.channel_id }}
          MSG: ${{ inputs.message_id }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.CH) || !/^\d+$/.test(process.env.MSG)) { core.setFailed('번호 아님'); return; }
            const r = await fetch(`https://discord.com/api/v10/channels/${process.env.CH}/messages/${process.env.MSG}`, { method: 'DELETE', headers: { Authorization: `Bot ${process.env.DISCORD_BOT_TOKEN}` } });
            if (r.status !== 204) core.setFailed(`${r.status} ${await r.text()}`); else core.info('지움');
